agents:
  - id: sightseeing_agent
    version: "1.0"
    enabled: true
    name: Sightseeing Agent
    description: Plans sightseeing activities, attractions, and landmarks.
    capabilities: [sightseeing, attractions, landmarks]
    instructions: Analyze the assigned sightseeing task and return structured recommendations.
    input_contract: {type: object, required: [task]}
    output_contract: {type: object, required: [agent_id, recommendation, evidence]}
    allowed_tools: []
    limits: {timeout_seconds: 60, max_tool_calls: 5}

  - id: adventure_agent
    version: "1.0"
    enabled: true
    name: Adventure Agent
    description: Finds adventure, outdoor, and recreational activities.
    capabilities: [adventure, outdoor, games]
    instructions: Analyze only the assigned adventure task and return structured recommendations.
    input_contract: {type: object, required: [task]}
    output_contract: {type: object, required: [agent_id, recommendation, evidence]}
    allowed_tools: []
    limits: {timeout_seconds: 60, max_tool_calls: 5}

  - id: car_rental_agent
