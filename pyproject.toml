[project]
name = "dynamic-adk-agents"
version = "0.1.0"
description = "Learning platform for dynamic ADK-style agent orchestration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-bdd>=7.0"]
adk = ["google-adk>=1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: requires an explicitly configured Gemini API key",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
